# New-mechanisms cluster-panel run -- replacement error strain
# mechanism: H1: All-pay first-price
# persona:   spsb_error_loss_averse

experiment:
  name: "allpay_first_price__spsb_error_loss_averse"
  version: "v2-newmech-cluster-v2"
  description: "H1: All-pay first-price -- panel strain spsb_error_loss_averse"

mechanism_metadata:
  incentive_target:
    action: "target_bid_value_ratio"
    description: "H1: All-pay first-price"
    parameters:
      benchmark: "value**3 / 49**2"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"
  price_order: "allpay"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "allpay_first_price.txt"

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 9601

llm:
  model: "gpt-5.4-mini"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  persona_file: "rule_prompt_v2/personas/spsb_error_modes/spsb_error_loss_averse.txt"
  include_payment_example: true

execution:
  repetitions: 15
  parallel: true
  max_workers: 4
  output_dir: "data_v2/experiment_logs/gpt5mini/newmech_allpay_first_price__spsb_error_loss_averse"
