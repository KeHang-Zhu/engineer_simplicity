# First-price sealed-bid (FPSB) IPV stress-test mechanism.
# n=3, values ~ U[0,50]. Risk-neutral BNE bid = (n-1)/n * v = (2/3) v.
# Human regularity: overbidding relative to RNNE (bids above (2/3)v, below v).

experiment:
  name: "fpsb_stress"
  version: "v2-stress-first-price"
  description: "First-price sealed-bid IPV stress test for the digital-mouse panel"

mechanism_metadata:
  incentive_target:
    action: "shade_below_value"
    description: "Risk-neutral bidders shade toward the (n-1)/n = 2/3 BNE; overbidding above this is the documented human regularity."
    parameters:
      min_bid_value_ratio: 0.4

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"
  price_order: "first"
  private_value: "private"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "private_first_price.txt"

value:
  common_range: [0, 29]
  private_range: 49
  increment: 0.1
  seed_base: 9001

llm:
  model: "gpt-5.4-mini"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  include_payment_example: true

execution:
  repetitions: 5
  parallel: true
  max_workers: 4
  output_dir: "data_v2/experiment_logs/stress_test_first_price/fpsb_stress"
