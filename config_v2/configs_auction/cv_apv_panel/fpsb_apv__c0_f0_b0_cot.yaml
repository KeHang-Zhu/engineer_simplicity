# CV/APV supplement to the unrestricted EA run
# mechanism: FPSB APV
# persona:   c0_f0_b0_cot

experiment:
  name: "fpsb_apv__c0_f0_b0_cot"
  version: "v2-cv-apv-supplement"
  description: "FPSB APV -- panel strain c0_f0_b0_cot"

mechanism_metadata:
  incentive_target:
    action: "shade_below_value"
    description: "FPSB APV"
    parameters:
      benchmark: "((3 - 1) / 3) * v"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"
  price_order: "first"
  private_value: "affiliated"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "affiliated_fpsb.txt"

value:
  common_range: [20, 29]
  private_range: 49
  increment: 0.1
  seed_base: 9801

llm:
  model: "gpt-5.4-mini"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  persona_file: "rule_prompt_v2/personas/spsb_basis_cot/c0_f0_b0.txt"
  include_payment_example: true

execution:
  repetitions: 10
  parallel: true
  max_workers: 4
  output_dir: "data_v2/experiment_logs/gpt5mini/cv_apv_fpsb_apv__c0_f0_b0_cot"
