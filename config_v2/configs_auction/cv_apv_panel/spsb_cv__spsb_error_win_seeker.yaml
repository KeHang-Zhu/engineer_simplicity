# CV/APV supplement to the unrestricted EA run
# mechanism: SPSB CV
# persona:   spsb_error_win_seeker

experiment:
  name: "spsb_cv__spsb_error_win_seeker"
  version: "v2-cv-apv-supplement"
  description: "SPSB CV -- panel strain spsb_error_win_seeker"

mechanism_metadata:
  incentive_target:
    action: "shade_below_value"
    description: "SPSB CV"
    parameters:
      benchmark: "v"

auction:
  number_agents: 3
  rounds: 1

rule:
  seal_clock: "seal"
  ascend_descend: "ascend"
  price_order: "second"
  private_value: "common"
  open_blind: "open"
  closing: false
  reserve_price: 0
  special_name: "common_second_price.txt"

value:
  common_range: [20, 29]
  private_range: 49
  increment: 0.1
  seed_base: 9801

llm:
  model: "gpt-5.4-mini"
  temperature: 0.5

prompt:
  strategy_type: "plan_reflection"
  prompt_dir: "Prompt/"
  rule_template_dir: "rule_template/auctions/"
  persona_file: "rule_prompt_v2/personas/spsb_error_modes/spsb_error_win_seeker.txt"
  include_payment_example: true

execution:
  repetitions: 10
  parallel: true
  max_workers: 4
  output_dir: "data_v2/experiment_logs/gpt5mini/cv_apv_spsb_cv__spsb_error_win_seeker"
